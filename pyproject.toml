[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "launchpad_ai"
version = "0.1.0"
description = "A general-purpose engine for document ingestion, validation, and calibration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0"
]

[tool.setuptools]
# This explicitly restricts the build engine to only expose the 'app' directory
packages = ["app"]